spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:h2:mem:bloodbank-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  cors:
    origin: http://localhost:5173
  jwt:
    secret: TestSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmRequirement12345
    expiration: 3600000
    refresh:
      expiration: 604800000
